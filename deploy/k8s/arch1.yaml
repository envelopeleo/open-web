# Arch1：FastAPI 資料來源。SQLite 版（資料在容器內，重啟重 seed）。
# 啟動時自動 seed 那 10 筆資料。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: arch1-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: arch1-api
  template:
    metadata:
      labels:
        app: arch1-api
    spec:
      containers:
        - name: arch1-api
          image: arch1-api:local        # 本機 build 的 image（見部署說明）
          imagePullPolicy: IfNotPresent  # 用本機 image，不去外面拉
          ports:
            - containerPort: 8000        # 容器內維持 8000（與其他 pod 隔離，不衝突）
---
apiVersion: v1
kind: Service
metadata:
  name: arch1-api
spec:
  type: ClusterIP
  selector:
    app: arch1-api
  ports:
    - port: 8000
      targetPort: 8000
